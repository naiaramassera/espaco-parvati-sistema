{% extends 'base.html' %}

{% block content %}

<h2 class="section-title">Novo Agendamento</h2>
<p class="section-subtitle">Preencha os dados do atendimento. Ao salvar, o WhatsApp de confirmacao sera aberto.</p>

<div class="form-card">
    <form method="POST">
        <label>Cliente</label>
        <div class="autocomplete-wrap">
            <input type="text" name="cliente" id="campo-cliente" autocomplete="off" required placeholder="Digite o nome...">
            <ul class="autocomplete-list" id="lista-clientes"></ul>
        </div>

        <label>Telefone</label>
        <input type="text" name="telefone" id="campo-telefone" required placeholder="Ex: 31999990000">

        <label>Data</label>
        <input type="date" name="data" id="data" value="{{ data or '' }}" required>

        <label>Hora</label>
        <input type="time" name="hora" value="{{ hora or '' }}" min="07:00" max="20:00" step="600" required>

        <label>Profissional</label>
        <select name="profissional">
            {% for nome in profissionais %}
                <option value="{{ nome }}" {% if profissional == nome %}selected{% endif %}>{{ nome }}</option>
            {% endfor %}
        </select>

        <label>Procedimento cadastrado</label>
        <select name="procedimento_id" id="procedimento_id">
            <option value="">Informar manualmente</option>
            {% for item in procedimentos %}
                <option
                    value="{{ item.id }}"
                    data-nome="{{ item.nome }}"
                    data-valor="{{ item.valor_padrao or 0 }}"
                    data-custo="{{ custos_reais.get(item.id, item.custo_estimado or 0) }}"
                    data-duracao="{{ item.duracao_minutos or 60 }}"
                    data-retorno="{{ item.retorno_dias or '' }}"
                    data-orientacoes="{{ item.orientacoes or '' }}"
                >
                    {{ item.categoria or 'Geral' }} - {{ item.nome }}
                </option>
            {% endfor %}
        </select>

        <label>Procedimento</label>
        <input type="text" name="procedimento" id="procedimento" required>

        <div class="premium-form-grid">
            <div>
                <label>Valor</label>
                <input type="number" step="0.01" name="valor" id="valor" required>
            </div>
            <div>
                <label>Custo estimado</label>
                <input type="number" step="0.01" name="custo_estimado" id="custo_estimado">
            </div>
            <div>
                <label>Duracao em minutos</label>
                <input type="number" name="duracao_minutos" id="duracao_minutos" value="60">
            </div>
            <div>
                <label>Retorno em dias</label>
                <input type="number" name="retorno_dias" id="retorno_dias">
            </div>
        </div>

        <label>Forma de pagamento</label>
        <select name="pagamento">
            <option>Pix</option>
            <option>Cartao</option>
            <option>Dinheiro</option>
            <option>Transferencia</option>
            <option>Boleto</option>
        </select>

        <label>Observacoes do atendimento</label>
        <textarea name="observacoes" id="observacoes" rows="4" placeholder="Orientacoes, observacoes clinicas ou detalhes importantes"></textarea>

        <button type="submit" class="btn-gold">Salvar e enviar WhatsApp</button>
    </form>
</div>

<script>
// ── Autocomplete de clientes ──────────────────────────────────────────────
(function () {
    const campoCliente = document.getElementById("campo-cliente");
    const campoTelefone = document.getElementById("campo-telefone");
    const lista = document.getElementById("lista-clientes");
    let timer;

    campoCliente.addEventListener("input", function () {
        clearTimeout(timer);
        const q = this.value.trim();
        if (q.length < 2) { lista.innerHTML = ""; lista.style.display = "none"; return; }

        timer = setTimeout(() => {
            fetch(`/api/clientes/buscar?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(clientes => {
                    lista.innerHTML = "";
                    if (!clientes.length) { lista.style.display = "none"; return; }
                    clientes.forEach(c => {
                        const li = document.createElement("li");
                        li.textContent = c.nome + (c.telefone ? ` — ${c.telefone}` : "");
                        li.addEventListener("mousedown", () => {
                            campoCliente.value = c.nome;
                            campoTelefone.value = c.telefone || "";
                            lista.innerHTML = "";
                            lista.style.display = "none";
                        });
                        lista.appendChild(li);
                    });
                    lista.style.display = "block";
                });
        }, 250);
    });

    document.addEventListener("click", e => {
        if (!campoCliente.contains(e.target)) { lista.innerHTML = ""; lista.style.display = "none"; }
    });
})();

// ── Preenche campos ao selecionar procedimento ────────────────────────────
document.getElementById("procedimento_id").addEventListener("change", function () {
    const selected = this.options[this.selectedIndex];
    if (!selected.value) {
        return;
    }

    document.getElementById("procedimento").value = selected.dataset.nome || "";
    document.getElementById("valor").value = selected.dataset.valor || "";
    document.getElementById("custo_estimado").value = selected.dataset.custo || "";
    document.getElementById("duracao_minutos").value = selected.dataset.duracao || "60";
    document.getElementById("retorno_dias").value = selected.dataset.retorno || "";

    const orientacoes = selected.dataset.orientacoes || "";
    if (orientacoes && !document.getElementById("observacoes").value) {
        document.getElementById("observacoes").value = orientacoes;
    }
});
</script>

{% endblock %}
