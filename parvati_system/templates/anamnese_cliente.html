<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamnese - Parvati Estetica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="panel-card" style="max-width: 760px; margin: 40px auto;">
        <h1 class="section-title">Ficha de Anamnese</h1>
        <p class="section-subtitle">Preencha as informacoes antes do atendimento.</p>

        <form method="POST">
            <label>Nome</label>
            <input type="text" name="cliente" value="{{ cliente.nome }}" readonly>

            <label>Telefone</label>
            <input type="text" name="telefone" value="{{ cliente.telefone or '' }}" readonly>

            <label>Idade</label>
            <input type="number" name="idade" value="{{ cliente.idade or '' }}">

            <label>Sexo</label>
            <select name="sexo">
                <option>Feminino</option>
                <option>Masculino</option>
                <option>Outro</option>
            </select>

            <label>Possui alguma doenca ou condicao importante?</label>
            <textarea name="doenca"></textarea>

            <label>Usa medicacao?</label>
            <textarea name="medicacao"></textarea>

            <label>Alergias</label>
            <textarea name="alergias"></textarea>

            <label>Procedimento desejado ou agendado</label>
            <input type="text" name="procedimento">

            <label>Observacoes</label>
            <textarea name="observacoes"></textarea>

            <button type="submit" class="btn-gold">Enviar anamnese</button>
        </form>
    </main>
</body>
</html>
