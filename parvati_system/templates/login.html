{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center">Login do Sistema</h2>

<form method="POST" class="login-box">

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <input type="password"
           name="senha"
           placeholder="Senha"
           required>

    <button type="submit">
        Entrar
    </button>

</form>

{% endblock %}
